planner_reply:
  name: Deliver Planner reply
  description: Internal reply to an outstanding Pixora Voice Planner request. Unmatched replies are ignored.
  fields:
    request_id:
      required: true
      selector:
        text:
    speech:
      required: true
      selector:
        text:
planner_vocabulary:
  name: Read Planner speech vocabulary
  description: Read bounded household names and followed teams through the existing paired connector when Planner integration is enabled.

flow_reply:
  name: Deliver Flow reply
  description: Internal reply to an outstanding authenticated voice Flow request. Unmatched replies are ignored.
flow_vocabulary:
  name: Read enabled Flow phrases
  description: Read up to 64 enabled voice trigger phrases using the paired Home Control connection.

refresh_flow_phrases:
  name: Refresh Voice triggers
  description: Accept saved enabled Flow phrases and global variable names from Flows, save local speech vocabulary and restart Speech-to-Phrase once. No automatic retry.
  fields:
    phrases:
      required: true
      selector:
        object:
    variables:
      required: true
      selector:
        object:

show_card:
  name: Show card
  description: Show a priority message directly over local Wi-Fi, then resume the
    deck or show Waiting.
  fields:
    config_entry_id:
      name: Display
      required: true
      selector:
        config_entry:
          integration: pixora_local
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    color:
      name: Text color
      default:
      - 255
      - 255
      - 255
      selector:
        color_rgb: null
    duration:
      name: Show for
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
          mode: box
show_image:
  name: Show image card
  description: Send a local Home Assistant image directly to the panel. The image
    is fitted to the panel without cropping.
  fields:
    config_entry_id:
      name: Display
      required: true
      selector:
        config_entry:
          integration: pixora_local
    image_path:
      name: Image file
      description: A local allowed file, for example /config/www/washer.png.
      required: true
      selector:
        text: null
    duration:
      name: Show for
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
          mode: box
play_deck:
  name: Play deck
  description: Start the assigned local deck or choose a saved deck by name.
  fields:
    config_entry_id:
      name: Display
      required: true
      selector:
        config_entry:
          integration: pixora_local
    deck:
      name: Deck name or ID
      description: Leave blank to use the assigned deck.
      selector:
        text: null
pause_deck:
  name: Pause deck
  description: Pause local deck playback.
  fields:
    config_entry_id:
      name: Display
      required: true
      selector:
        config_entry:
          integration: pixora_local
